<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>ERES — Tamamlama Kaydı Doğrulama</title>
<link rel="icon" type="image/svg+xml" href="/images/logos/Eres_Sembol_Renkli.svg">
<style>
:root {
  --ink:#18302e; --muted:#657774; --line:#d9e5e2; --soft:#f4f8f7;
  --brand:#0f5c55; --ok:#176b43; --bad:#a43f3f;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7faf9;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:36px 20px 56px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 55px rgba(18,55,51,.08);overflow:hidden}
.head{padding:28px 32px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;justify-content:space-between}
.logo{height:46px;max-width:280px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.body{padding:34px 32px 38px}
.state{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;margin:0 0 28px;background:#edf7f2;color:var(--ok);font-weight:700}
.state.bad{background:#fff0f0;color:var(--bad)}
h1{font-size:34px;line-height:1.12;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 30px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{padding:18px 20px;border-bottom:1px solid var(--line)}
.item:nth-child(odd){border-right:1px solid var(--line)}
.item.full{grid-column:1/-1;border-right:0}
.item:last-child,.item:nth-last-child(2){border-bottom:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}
.value{font-size:16px;line-height:1.45;font-weight:650;word-break:break-word}
.note{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.65}
.empty{padding:24px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);line-height:1.6}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
@media(max-width:650px){.head{padding:22px 20px}.body{padding:26px 20px}.grid{grid-template-columns:1fr}.item:nth-child(odd){border-right:0}.item{border-bottom:1px solid var(--line)!important}.item:last-child{border-bottom:0!important}h1{font-size:28px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <header class="head">
      <img class="logo" src="/images/logos/Eres_Yatay_AcikZemin.svg" alt="ERES Biyoinformatik">
      <div class="kicker">Credential Verification</div>
    </header>
    <div class="body">
      <div id="result"></div>
    </div>
  </section>
</main>
<script>
const PUBLIC_JWK = {"kty":"EC","crv":"P-256","x":"UQKlUCqImoOsWaDfbKVZctVl36fqKFK9t3oiOemjaNM","y":"S0WthwoLYKYVzTkfgubsEKLVttABsP2hmmnrq95dU-w","ext":true,"key_ops":["verify"]};

const b64urlToBytes = (s) => {
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
};
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtDate = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length===10 ? 'T12:00:00' : ''));
  return Number.isNaN(d.getTime()) ? iso : new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'long',year:'numeric'}).format(d);
};

async function verify() {
  const root = document.getElementById('result');
  const p = new URLSearchParams(location.search);
  const d = p.get('d');
  const s = p.get('s');
  if (!d || !s) {
    root.innerHTML = `
      <h1>Tamamlama Kaydı Doğrulama</h1>
      <p class="sub">ERES tarafından oluşturulan bir kaydı doğrulamak için belgenizdeki QR kodunu okutun.</p>
      <div class="empty">Doğrulama verisi bulunamadı. QR kodundan açılan bağlantıyı kullandığınızdan emin olun.</div>`;
    return;
  }
  try {
    const payloadBytes = b64urlToBytes(d);
    const sigBytes = b64urlToBytes(s);
    const key = await crypto.subtle.importKey('jwk', PUBLIC_JWK, {name:'ECDSA',namedCurve:'P-256'}, false, ['verify']);
    const ok = await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, key, sigBytes, payloadBytes);
    if (!ok) throw new Error('invalid signature');
    const data = JSON.parse(new TextDecoder().decode(payloadBytes));
    root.innerHTML = `
      <div class="state">✓ ERES dijital kaydı doğrulandı</div>
      <div class="kicker">Dijital Tamamlama Kaydı</div>
      <h1>${esc(data.name)}</h1>
      <p class="sub">Bu sayfa, QR bağlantısındaki kaydın ERES tarafından oluşturulduğunu kriptografik imza ile doğrular.</p>
      <div class="grid">
        <div class="item full"><div class="label">Çalışma / Work</div><div class="value">${esc(data.title)}</div></div>
        <div class="item"><div class="label">Credential ID</div><div class="value"><code>${esc(data.cid)}</code></div></div>
        <div class="item"><div class="label">Kayıt Türü / Record Type</div><div class="value">Completion Record</div></div>
        <div class="item"><div class="label">Tamamlanma / Completion</div><div class="value">${esc(fmtDate(data.completed))}</div></div>
        <div class="item"><div class="label">Düzenlenme / Issued</div><div class="value">${esc(fmtDate(data.issued))}</div></div>
      </div>
      <div class="note">
        Bu doğrulama, dijital kaydın ERES tarafından oluşturulduğunu gösterir. Kayıt diploma, mesleki yeterlilik veya kamu kurumu onayı niteliğinde değildir.
        <br><br>
        This verification confirms that the digital record was issued by ERES. It does not constitute a degree, professional qualification or government accreditation.
      </div>`;
  } catch (e) {
    root.innerHTML = `
      <div class="state bad">× Kayıt doğrulanamadı</div>
      <h1>Doğrulama başarısız</h1>
      <p class="sub">Bağlantı değiştirilmiş, eksik veya ERES tarafından oluşturulmamış olabilir.</p>`;
  }
}
verify();
</script>
</body>
</html>
