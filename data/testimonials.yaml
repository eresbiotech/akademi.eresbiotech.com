irem:
  name: "İrem"
  program: "Biyoinformatiğe Giriş & Büyük Veri"
  short_quote: "“Programı tamamladıktan sonra literatür taramasını daha bilinçli yapabildiğimi, NCBI gibi biyolojik veri tabanlarında daha rahat hareket edebildiğimi düşünüyorum.”"
  full_quote: "“Programa başlamadan önce biyoinformatik alanına ilgim vardı ancak özellikle literatür taraması, biyolojik veri tabanlarının kullanımı ve bu veri tabanlarından doğru bilgiye ulaşma konusunda oldukça başlangıç seviyesindeydim. Programı tamamladıktan sonra literatür taramasını daha bilinçli yapabildiğimi, NCBI gibi biyolojik veri tabanlarında daha rahat hareket edebildiğimi ve BLAST, FASTA, GenBank gibi araç ve kaynakların ne amaçla ve nasıl kullanıldığını çok daha iyi anladığımı düşünüyorum.”"
  approved: true
  attribution_mode: "first_name_only"
